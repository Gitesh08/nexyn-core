[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexyn-core"
version = "1.0.1"
description = "A biological memory upgrade layer for Cognee, adding Valence, Consolidation, and Decay physics to vector graphs."
authors = [
    { name = "Nexyn Core Team", email = "gmahadik8080@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cognee>=0.1.20",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
"Homepage" = "https://github.com/Gitesh08/nexyn-core"
"Website" = "https://synapse-ivory-ten.vercel.app"
"Documentation" = "https://github.com/Gitesh08/nexyn-core/blob/main/README.md"
"Demo" = "https://synapse-ivory-ten.vercel.app/demo"

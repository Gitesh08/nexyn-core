[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-core"
version = "0.1.0"
description = "A biomimetic memory consolidation layer for LLMs"
authors = [
    { name = "Synapse team", email = "gmahadik8080@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "cognee",
    "pydantic>=2.4.2",
    "pydantic-settings",
    "aiosqlite",
    "apscheduler",
    "tenacity",
    "httpx",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio",
    "pytest-mock"
]

[project.scripts]
synapse-server = "synapse.main:run_server"

[tool.pytest.ini_options]
asyncio_mode = "auto"
